# CI-only overrides. Never used on the server.
#
# The production file is brought up FIRST, exactly as it ships, and checked in
# that shape (LTI auth, no dev login, nothing but Caddy exposed). Only then is
# this layered on, to do the things a production configuration correctly
# refuses: sign in without an LMS, seed demo data, reach MySQL from the runner,
# and talk to a local S3 (MinIO) instead of real object storage.
#
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

services:
  mysql:
    # The backup round-trip runs from the runner, so it needs the port.
    ports:
      - '3306:3306'

  migrate:
    environment:
      NODE_ENV: test

  api:
    environment:
      # NOT production: dev login-as is how a journey runs without an LMS, and
      # production refuses AUTH_MODE=dev (which is the point of that refusal).
      NODE_ENV: test
      AUTH_MODE: dev
      CSRF_ENFORCED: 'false'

  web:
    environment:
      # Next still builds and serves as a production build; only the API's auth
      # mode differs. Keeping NODE_ENV=production here also keeps the /api
      # rewrite disabled, so the journey really does go through Caddy.
      NODE_ENV: production

  # Object storage for the backup round-trip. Same API as the real thing.
  #
  # From quay.io, not Docker Hub: MinIO publishes there, and the Docker Hub
  # repository has no tags at all (a tag pinned there fails to pull).
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ci-access-key
      MINIO_ROOT_PASSWORD: ci-secret-key
    ports:
      - '9000:9000'
    healthcheck:
      # The server image has no mc; probe the live endpoint instead.
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-bucket:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set ci http://minio:9000 ci-access-key ci-secret-key &&
      mc mb --ignore-existing ci/mission-hub-backups &&
      echo bucket ready"

  backup:
    environment:
      # A backup that fails to reach storage must fail the run, not warn.
      BACKUP_S3_ENDPOINT: http://minio:9000
      BACKUP_S3_REGION: us-east-1
      BACKUP_S3_BUCKET: mission-hub-backups
      BACKUP_S3_ACCESS_KEY: ci-access-key
      BACKUP_S3_SECRET_KEY: ci-secret-key
      BACKUP_ON_START: 'true'
      BACKUP_KEEP_DAILY: '2'
      BACKUP_KEEP_WEEKLY: '1'
    depends_on:
      mysql:
        condition: service_healthy
      minio-bucket:
        condition: service_completed_successfully
