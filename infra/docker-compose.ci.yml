# CI-only overrides. Never used on the server.
#
# The production file is brought up FIRST, exactly as it ships, and checked in
# that shape (LTI auth, no dev login, nothing but Caddy exposed). Only then is
# this layered on, to do the things a production configuration correctly
# refuses: sign in without an LMS, seed demo data, reach MySQL from the runner,
# and talk to a local S3 endpoint instead of real object storage.
#
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

services:
  mysql:
    # The backup round-trip runs from the runner, so it needs the port.
    ports:
      - '3306:3306'

  migrate:
    environment:
      NODE_ENV: test

  api:
    environment:
      # NOT production: dev login-as is how a journey runs without an LMS, and
      # production refuses AUTH_MODE=dev (which is the point of that refusal).
      NODE_ENV: test
      AUTH_MODE: dev
      CSRF_ENFORCED: 'false'
      # The runner has no certificate, so Caddy serves plain HTTP here and
      # X-Forwarded-Proto is http. A SameSite=None cookie must be Secure, which
      # a browser (and the journey script) would then never receive. The journey
      # therefore runs with a lax cookie; the production shape above still uses
      # SameSite=None, and TRUST_PROXY is what makes it work over real TLS.
      SESSION_SAMESITE: lax

  web:
    environment:
      # Next still builds and serves as a production build; only the API's auth
      # mode differs. Keeping NODE_ENV=production here also keeps the /api
      # rewrite disabled, so the journey really does go through Caddy.
      NODE_ENV: production

  # The object store the backup round-trip runs against. This was MinIO until
  # September 2026, when MinIO put its images behind authentication on both
  # quay.io and Docker Hub - every anonymous pull now answers 401, so CI cannot
  # fetch them at all. s3mock speaks the same S3 API, creates its bucket from an
  # environment variable (so the mc sidecar is gone), and is pullable.
  # PRODUCTION IS UNAFFECTED: it points BACKUP_S3_ENDPOINT at real storage; this
  # file is CI only.
  s3:
    image: adobe/s3mock:5.2.3
    # No environment: this version ignored initialBuckets and the backup sidecar
    # failed with NoSuchBucket. The CI step creates the bucket with one aws call
    # instead, which depends on nothing about the image.
    # 9090 is its plain-HTTP port (9191 is HTTPS and needs a certificate nobody
    # here has). No port override: "server.port" is not a valid OS environment
    # variable name, and passing it as one stopped the container dead.
    ports:
      - '9000:9090'
    # No healthcheck: this image is built with buildpacks and carries no shell
    # tools to probe itself with. The CI step waits for the endpoint from the
    # runner, which does have curl, before bringing anything that needs it up.

  backup:
    environment:
      # A backup that fails to reach storage must fail the run, not warn.
      BACKUP_S3_ENDPOINT: http://s3:9090
      BACKUP_S3_REGION: us-east-1
      BACKUP_S3_BUCKET: mission-hub-backups
      BACKUP_S3_ACCESS_KEY: ci-access-key
      BACKUP_S3_SECRET_KEY: ci-secret-key
      BACKUP_ON_START: 'true'
      BACKUP_KEEP_DAILY: '2'
      BACKUP_KEEP_WEEKLY: '1'
    depends_on:
      mysql:
        condition: service_healthy
      s3:
        condition: service_started
