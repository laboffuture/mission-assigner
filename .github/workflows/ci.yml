name: CI

on:
  push:
  pull_request:

# Four independent jobs, so each part of the product reports its own result and
# one failure never hides another:
#   api         - root tree: typecheck, lint, format, check:tokens, migrations and
#                 the whole regression suite (verify:all, incl. pytest).
#   web-static  - web tree: typecheck, lint, format, check:tokens, next build.
#   e2e         - the full Playwright suite (journeys across every id length, a11y).
#   audit       - the 62-case audit harness (verify-audit.mjs).
# Every job fails on any failure; nothing here is allowed to be advisory.

env:
  DB_HOST: 127.0.0.1
  DB_USER: root
  DB_PASS: devpass
  DB_NAME: mission_demo
  AUTH_MODE: dev
  LOG_LEVEL: info
  ENABLE_TEST_HOOKS: '1'

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: devpass
          MYSQL_DATABASE: mission_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pdevpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover MySQL container
        run: |
          CID=$(docker ps -q --filter ancestor=mysql:8 | head -1)
          echo "MYSQL_CID=$CID" >> "$GITHUB_ENV"  # for docker stop/start only; the tooling itself uses the host mysql clients

      # The documented setup step, run the documented way — so the command the
      # README and the boot failure both name is the one CI proves.
      - name: Load timezone tables (npm run db:timezones)
        run: npm run db:timezones

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Token check (web components)
        run: npm run check:tokens

      - name: Run migrations
        run: npm run db:migrate

      - name: Set up Python (Stage 2 pipeline)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Stage 2 pipeline deps
        working-directory: pipeline
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --quiet --upgrade pip
          ./.venv/bin/pip install --quiet -r requirements.txt

      - name: Start API
        run: |
          npx tsx src/server.ts > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/dev/users >/dev/null; then echo "API up"; exit 0; fi
            sleep 2
          done
          echo "API did not start"; cat /tmp/server.log; exit 1

      - name: Run all suites
        run: npm run verify:all

      - name: API log (on failure)
        if: failure()
        run: cat /tmp/server.log || true

  web-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Token check
        run: npm run check:tokens

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Sharded across jobs, not workers. The specs mutate shared student state and
    # reseed the database between them, so playwright's own parallelism would
    # race; a separate job per shard gives each one its own MySQL service and its
    # own app, which is isolation by construction rather than by convention.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: e2e (shard ${{ matrix.shard }}/2)
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: devpass
          MYSQL_DATABASE: mission_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pdevpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies (API and web)
        run: |
          npm ci
          npm --prefix web ci

      - name: Load MySQL timezone tables
        run: |
          CID=$(docker ps -q --filter ancestor=mysql:8 | head -1)
          docker exec "$CID" sh -c "mysql_tzinfo_to_sql /usr/share/zoneinfo | mysql -uroot -pdevpass mysql"

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed

      # Installed on EVERY run. After the move to a new machine the pinned
      # browser was missing and the whole suite was silently unrunnable.
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Start API and web
        run: |
          npx tsx src/server.ts > /tmp/server.log 2>&1 &
          (cd web && npx next start -p 3001 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/api/dev/users >/dev/null && curl -sf http://localhost:3001/login >/dev/null; then echo "stack up"; exit 0; fi
            sleep 2
          done
          echo "stack did not start"; cat /tmp/server.log /tmp/web.log; exit 1

      - name: Playwright (accessibility included)
        working-directory: web
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

      - name: Logs (on failure)
        if: failure()
        run: cat /tmp/server.log /tmp/web.log || true

  audit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: devpass
          MYSQL_DATABASE: mission_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pdevpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies (API and web)
        run: |
          npm ci
          npm --prefix web ci

      - name: Discover MySQL container and load timezone tables
        run: |
          CID=$(docker ps -q --filter ancestor=mysql:8 | head -1)
          echo "MYSQL_CID=$CID" >> "$GITHUB_ENV"  # for docker stop/start only; the tooling itself uses the host mysql clients
          docker exec "$CID" sh -c "mysql_tzinfo_to_sql /usr/share/zoneinfo | mysql -uroot -pdevpass mysql"

      - name: Set up Python (pipeline cases)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Stage 2 pipeline deps
        working-directory: pipeline
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --quiet --upgrade pip
          ./.venv/bin/pip install --quiet -r requirements.txt

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Start API and web
        run: |
          npx tsx src/server.ts > /tmp/server.log 2>&1 &
          (cd web && npx next start -p 3001 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/api/dev/users >/dev/null && curl -sf http://localhost:3001/login >/dev/null; then echo "stack up"; exit 0; fi
            sleep 2
          done
          echo "stack did not start"; cat /tmp/server.log /tmp/web.log; exit 1

      # Cases 43/44 stop and restart MySQL; here that is the service container.
      - name: Audit harness (62 cases)
        env:
          AUDIT_MYSQL_STOP_CMD: docker stop ${{ env.MYSQL_CID }}
          AUDIT_MYSQL_START_CMD: docker start ${{ env.MYSQL_CID }}
          MYSQL_CLIENT: mysql
        run: npm run verify:audit

      # Every case sets up its own state, so the order must not matter. A fresh
      # random seed each run (printed, so a failure is reproducible) turns that
      # from a claim into something CI keeps testing.
      - name: Audit harness again, in a shuffled order
        env:
          AUDIT_MYSQL_STOP_CMD: docker stop ${{ env.MYSQL_CID }}
          AUDIT_MYSQL_START_CMD: docker start ${{ env.MYSQL_CID }}
          MYSQL_CLIENT: mysql
        run: |
          # A random seed each run, unless AUDIT_SHUFFLE_SEED pins one — which is
          # how a reported failure gets reproduced instead of waited for.
          SEED="${AUDIT_SHUFFLE_SEED:-$RANDOM$RANDOM}"
          echo "shuffle seed: $SEED  (reproduce with: npm run verify:audit -- --shuffle=$SEED)"
          if ! npm run verify:audit -- --shuffle=$SEED; then
            echo "::error title=Audit (shuffled)::the audit failed in shuffled order with seed $SEED"
            exit 1
          fi

      - name: Logs (on failure)
        if: failure()
        run: cat /tmp/server.log /tmp/web.log || true
  # ---------------------------------------------------------------- stack --
  # The deployment itself: both images, the whole compose stack, a student
  # journey through Caddy, and the backup round-trip via a local S3. This is the
  # evidence that infra/ works, since it cannot be run on a Windows laptop
  # without Docker.
  stack:
    name: stack (compose, journey, backups)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configuration for the run
        working-directory: infra
        run: |
          # Real-shaped values; secrets are generated here and never committed.
          DB_PASS_VALUE=$(openssl rand -hex 16)
          SESSION_SECRET_VALUE=$(openssl rand -hex 32)
          cat > .env.production <<EOF
          SITE_ADDRESS=:80
          ACME_EMAIL=ci@example.org
          LMS_ORIGIN=https://lms.example.org
          DB_NAME=mission_demo
          DB_PASS=$DB_PASS_VALUE
          SESSION_SECRET=$SESSION_SECRET_VALUE
          SESSION_MAX_AGE=43200
          SESSION_SAMESITE=none
          AUTH_MODE=lti
          CSRF_ENFORCED=true
          SELECTION_MODE=legacy
          INSTANCE_COUNT=1
          LOG_LEVEL=info
          EOF
          echo "wrote infra/.env.production ($(wc -l < .env.production) lines)"

          # This workflow sets DB_PASS=devpass and AUTH_MODE=dev at the top level
          # for the harness jobs, and Docker Compose gives the SHELL environment
          # precedence over --env-file. Without this, the production-shape test
          # would be handed dev auth and a shipped-default password — which the
          # app rightly refuses to boot with. Override them for this job so the
          # generated file is what actually reaches the containers.
          {
            echo "DB_PASS=$DB_PASS_VALUE"
            echo "SESSION_SECRET=$SESSION_SECRET_VALUE"
            echo "AUTH_MODE=lti"
            echo "DB_NAME=mission_demo"
          } >> "$GITHUB_ENV"

      # Every image tag we name must exist. Three invented tags reached CI in one
      # batch and each cost a round trip to discover at pull time.
      - name: Image tags resolve
        run: node scripts/check-image-tags.mjs

      # The database's init script is sourced by the MySQL entrypoint, so its
      # shell options are the entrypoint's. Cheap to check here; as a bring-up
      # failure it only ever looked like a timeout.
      - name: The MySQL init script does not break its own entrypoint
        run: bash .github/scripts/tz-init-sourcing-test.sh

      # The compose file cannot rot unnoticed.
      - name: docker compose config
        working-directory: infra
        run: |
          docker compose --env-file .env.production config > /dev/null
          docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.ci.yml config > /dev/null
          echo "compose files valid"

      # Job logs need repository-admin rights to read, so a build failure has to
      # explain itself in an annotation instead.
      - name: Build images
        working-directory: infra
        run: |
          set -o pipefail
          if ! docker compose --env-file .env.production build api web backup 2>&1 | tee /tmp/build.log; then
            echo "::error title=Stack image build failed::$(tail -c 900 /tmp/build.log | paste -sd' ' -)"
            exit 1
          fi

      # ---- 1. Production shape: exactly what ships to the server.
      - name: Bring the stack up (production configuration)
        working-directory: infra
        run: |
          set -o pipefail
          if ! docker compose --env-file .env.production up -d mysql migrate api web caddy 2>&1 | tee /tmp/up.log; then
            echo "::error title=Stack up failed::$(grep -iE 'error|unhealthy|dependency|exited' /tmp/up.log | tail -5 | paste -sd' | ' - | tail -c 800)"
            docker compose --env-file .env.production ps -a > /tmp/ps.log 2>&1 || true
            echo "::error title=Stack state::$(tail -c 700 /tmp/ps.log | paste -sd' ' -)"
            docker compose --env-file .env.production logs --tail=40 > /tmp/svc.log 2>&1 || true
            echo "::error title=Service logs::$(tail -c 1200 /tmp/svc.log | paste -sd' ' -)"
            # What the health probe itself said, which the service log does not show.
            cid=$(docker compose --env-file .env.production ps -aq mysql | head -1)
            if [ -n "$cid" ]; then
              docker inspect --format '{{json .State.Health}}' "$cid" > /tmp/health.json 2>&1 || true
              echo "::error title=MySQL health::$(tail -c 900 /tmp/health.json | paste -sd' ' -)"
            fi
            exit 1
          fi

      - name: Wait for readiness through Caddy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/readyz || true)
            echo "attempt $i: /readyz -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error title=Stack::/readyz never returned 200"
          cd infra && docker compose --env-file .env.production ps && docker compose --env-file .env.production logs --tail=80
          exit 1

      - name: Migrations ran as a one-shot step, before the api
        working-directory: infra
        run: |
          state=$(docker compose --env-file .env.production ps -a --format json migrate | head -1)
          echo "$state"
          echo "$state" | grep -q '"ExitCode":0' || { echo "::error title=Stack::migrate did not exit 0"; exit 1; }
          docker compose --env-file .env.production logs migrate | tail -5

      - name: The production shape refuses what it should
        run: |
          fails=0
          expect() { # expect <what> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "  PASS $1 ($3)"
            else
              echo "  FAIL $1 (expected $2, got $3)"
              echo "::error title=Production shape::$1 — expected $2, got $3"
              fails=$((fails + 1))
            fi
          }
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          # Health and readiness are public, and say nothing else.
          expect "/healthz body" '{"status":"ok"}' "$(curl -s http://localhost/healthz)"
          expect "/readyz body" '{"status":"ready"}' "$(curl -s http://localhost/readyz)"
          # The API is reachable THROUGH CADDY (not via the Next rewrite) and
          # refuses an unauthenticated mutation. In this configuration
          # CSRF_ENFORCED=true, so a POST with no token is refused 403 by the
          # double-submit check BEFORE authentication is even reached — earlier
          # than the 401 the same request gets in development. Either is a
          # refusal; what matters is that it is refused and nothing is created.
          submit_code=$(code -X POST http://localhost/api/submit -H 'Content-Type: application/json' -d '{"assignmentId":1,"selected":"a"}')
          case "$submit_code" in
            401 | 403) echo "  PASS unauthenticated POST /api/submit refused ($submit_code)" ;;
            *) echo "::error title=Production shape::unauthenticated POST /api/submit was not refused (got $submit_code)"
               fails=$((fails + 1)) ;;
          esac
          # The staff page is gated server-side: anonymous is redirected to login.
          expect "anonymous GET /quality" 302 "$(code http://localhost/quality)"
          # Dev login must not sign anyone in here. It is not registered at all
          # under AUTH_MODE=lti (404); CSRF refuses it first (403). The thing
          # that must never happen is a session.
          devlogin=$(curl -s -D - -o /dev/null -X POST http://localhost/api/dev/login-as \
            -H 'Content-Type: application/json' -d '{"studentId":1}')
          devcode=$(printf '%s' "$devlogin" | head -1 | awk '{print $2}')
          case "$devcode" in
            403 | 404) echo "  PASS dev login-as refused ($devcode)" ;;
            *) echo "::error title=Production shape::dev login-as was not refused (got $devcode)"; fails=$((fails + 1)) ;;
          esac
          if printf '%s' "$devlogin" | grep -qi 'set-cookie: *mh_session'; then
            echo "::error title=Production shape::dev login-as SET A SESSION in the production configuration"
            fails=$((fails + 1))
          else
            echo "  PASS dev login-as set no session cookie"
          fi
          # The student UI is served by the web container. "Mission Hub" is in
          # the <title>, which is past the first few hundred bytes of head.
          expect "GET /login" 200 "$(code http://localhost/login)"
          if curl -s http://localhost/login | grep -qi 'mission hub'; then
            echo "  PASS /login is the student UI"
          else
            echo "::error title=Production shape::/login did not look like the student UI"
            fails=$((fails + 1))
          fi
          [ "$fails" = "0" ] || exit 1

      # ---- 2. A real student journey, end to end, through Caddy.
      - name: Layer the CI overrides (dev login, seed data, object storage)
        working-directory: infra
        run: |
          set -o pipefail
          compose() { docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.ci.yml "$@"; }
          # Object storage first, and waited for from HERE: the s3mock image is
          # built with buildpacks and has no shell tools to health-check itself
          # with, and the backup sidecar takes a backup the moment it starts.
          compose up -d s3
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:9000/ && break
            sleep 2
          done
          if ! curl -sf -o /dev/null http://localhost:9000/; then
            compose logs s3 > /tmp/s3.log 2>&1 || true
            echo "::error title=CI overrides::object storage never answered on :9000 — $(tail -c 500 /tmp/s3.log | paste -sd' ' -)"
            exit 1
          fi
          # Create the bucket HERE rather than through the image's own
          # initialBuckets setting, which this version ignored — the backup
          # sidecar then failed with NoSuchBucket. One CLI call, no dependence on
          # any image's configuration conventions. s3mock ignores credentials,
          # but the CLI refuses to run without some.
          export AWS_ACCESS_KEY_ID=ci-access-key AWS_SECRET_ACCESS_KEY=ci-secret-key                  AWS_DEFAULT_REGION=us-east-1 AWS_EC2_METADATA_DISABLED=true
          aws --endpoint-url http://localhost:9000 s3 mb s3://mission-hub-backups 2>/tmp/mb.log             || grep -qi 'BucketAlreadyOwnedByYou\|BucketAlreadyExists' /tmp/mb.log             || { echo "::error title=CI overrides::could not create the backup bucket — $(tail -c 300 /tmp/mb.log | paste -sd' ' -)"; exit 1; }
          aws --endpoint-url http://localhost:9000 s3 ls | sed 's/^/  bucket: /'
          if ! compose up -d 2>&1 | tee /tmp/ci-up.log; then
            echo "::error title=CI overrides::up failed — $(tail -c 700 /tmp/ci-up.log | paste -sd' ' -)"
            compose ps -a > /tmp/ci-ps.log 2>&1 || true
            echo "::error title=CI overrides state::$(tail -c 700 /tmp/ci-ps.log | paste -sd' ' -)"
            exit 1
          fi
          if ! compose run --rm -e NODE_ENV=test migrate node dist/seed.js 2>&1 | tee /tmp/seed.log; then
            echo "::error title=CI overrides::seed failed — $(tail -c 700 /tmp/seed.log | paste -sd' ' -)"
            exit 1
          fi
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/readyz)" = "200" ] && break
            sleep 5
          done

      - name: Student journey through Caddy
        run: node .github/scripts/stack-journey.mjs http://localhost

      # ---- 3. Backups: take one, push it offsite, restore FROM the remote copy.
      # The plans that matter are the ones from the deployed shape: the
      # containerised MySQL 8.4, after a real student journey has run against it.
      - name: Index review (EXPLAIN against the running stack)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_NAME: mission_demo
        run: |
          # This job has installed nothing so far — the compose build carries its
          # own dependencies. Without this, node exits 1 before any of the
          # script's own error handling exists, and the step says only "exit 1".
          npm ci
          export DB_PASS=$(grep '^DB_PASS=' infra/.env.production | cut -d= -f2)
          npm run db:explain

      - name: Backup round-trip via object storage
        working-directory: .
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_NAME: mission_demo
          BACKUP_S3_ENDPOINT: http://localhost:9000
          BACKUP_S3_REGION: us-east-1
          BACKUP_S3_BUCKET: mission-hub-backups
          BACKUP_S3_ACCESS_KEY: ci-access-key
          BACKUP_S3_SECRET_KEY: ci-secret-key
          BACKUP_S3_REQUIRED: 'true'
          BACKUP_KEEP_DAILY: '2'
          BACKUP_KEEP_WEEKLY: '1'
          # The bare `aws` calls in this step read the AWS_* names, not ours.
          # Without them the listing fails on credentials and the step reports
          # "uploaded nothing" even when the sidecar uploaded correctly.
          AWS_ACCESS_KEY_ID: ci-access-key
          AWS_SECRET_ACCESS_KEY: ci-secret-key
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          npm ci
          export DB_PASS=$(grep '^DB_PASS=' infra/.env.production | cut -d= -f2)
          mkdir -p ci-backups

          echo "--- the scheduled sidecar took one on start"
          docker compose --env-file infra/.env.production -f infra/docker-compose.yml -f infra/docker-compose.ci.yml \
            logs backup | tail -20
          # Keep the listing's own error text: piping into tee hid its exit code.
          aws --endpoint-url http://localhost:9000 s3 ls s3://mission-hub-backups/mission_demo/ > /tmp/remote.txt 2>&1 || true
          cat /tmp/remote.txt
          if ! grep -q 'sql.gz' /tmp/remote.txt; then
            docker compose --env-file infra/.env.production -f infra/docker-compose.yml -f infra/docker-compose.ci.yml               logs backup > /tmp/backup.log 2>&1 || true
            echo "::error title=Backups::no remote object found. listing said: $(tail -c 300 /tmp/remote.txt | paste -sd' ' -)"
            echo "::error title=Backup sidecar log::$(tail -c 700 /tmp/backup.log | paste -sd' ' -)"
            exit 1
          fi

          # The remote copy is a backup of the LIVE database, and step [5] of
          # backup-verify runs Stage 1 against the restore — which judges a
          # freshly seeded state. The journey above left real activity behind, so
          # reseed before taking the backup that will be verified.
          docker compose --env-file infra/.env.production -f infra/docker-compose.yml -f infra/docker-compose.ci.yml             run --rm -e NODE_ENV=test migrate node dist/seed.js > /tmp/reseed.log 2>&1 || {
              echo "::error title=Backups::reseed before the verified backup failed — $(tail -c 500 /tmp/reseed.log | paste -sd' ' -)"; exit 1; }

          echo "--- a manual backup uploads too"
          if ! BACKUP_DIR=./ci-backups bash scripts/backup.sh > /tmp/manual.log 2>&1; then
            cat /tmp/manual.log
            echo "::error title=Manual backup::$(tail -c 800 /tmp/manual.log | paste -sd' ' -)"
            exit 1
          fi
          cat /tmp/manual.log

          echo "--- restore FROM THE REMOTE COPY and run Stage 1 against it"
          if ! VERIFY_SOURCE=remote BACKUP_DIR=./ci-backups bash scripts/backup-verify.sh > /tmp/verify.log 2>&1; then
            tail -40 /tmp/verify.log
            echo "::error title=Restore from remote::$(tail -c 900 /tmp/verify.log | paste -sd' ' -)"
            exit 1
          fi
          tail -5 /tmp/verify.log

      - name: A failed upload fails the backup
        run: |
          export DB_PASS=$(grep '^DB_PASS=' infra/.env.production | cut -d= -f2)
          set +e
          DB_HOST=127.0.0.1 DB_USER=root DB_NAME=mission_demo \
          BACKUP_S3_ENDPOINT=http://localhost:9999 BACKUP_S3_BUCKET=mission-hub-backups \
          BACKUP_S3_ACCESS_KEY=ci-access-key BACKUP_S3_SECRET_KEY=ci-secret-key \
          BACKUP_S3_REQUIRED=true BACKUP_DIR=./ci-backups bash scripts/backup.sh
          code=$?
          set -e
          test "$code" = "3" || { echo "::error title=Backups::an unreachable bucket should fail the backup (exit 3), got $code"; exit 1; }
          echo "unreachable object storage failed the backup, as it should"

      - name: Logs on failure
        if: failure()
        working-directory: infra
        run: docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.ci.yml logs --tail=120

      - name: Tear down
        if: always()
        working-directory: infra
        run: docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.ci.yml down -v
