name: CI

on:
  push:
  pull_request:

# Four independent jobs, so each part of the product reports its own result and
# one failure never hides another:
#   api         - root tree: typecheck, lint, format, check:tokens, migrations and
#                 the whole regression suite (verify:all, incl. pytest).
#   web-static  - web tree: typecheck, lint, format, check:tokens, next build.
#   e2e         - the full Playwright suite (journeys across every id length, a11y).
#   audit       - the 62-case audit harness (verify-audit.mjs).
# Every job fails on any failure; nothing here is allowed to be advisory.

env:
  DB_HOST: 127.0.0.1
  DB_USER: root
  DB_PASS: devpass
  DB_NAME: mission_demo
  AUTH_MODE: dev
  LOG_LEVEL: info
  ENABLE_TEST_HOOKS: '1'

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: devpass
          MYSQL_DATABASE: mission_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pdevpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover MySQL container and load timezone tables
        run: |
          CID=$(docker ps -q --filter ancestor=mysql:8 | head -1)
          echo "MYSQL_CID=$CID" >> "$GITHUB_ENV"  # for docker stop/start only; the tooling itself uses the host mysql clients
          # Named-zone support (Asia/Kolkata) for the streak/timezone suite.
          docker exec "$CID" sh -c "mysql_tzinfo_to_sql /usr/share/zoneinfo | mysql -uroot -pdevpass mysql"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Token check (web components)
        run: npm run check:tokens

      - name: Run migrations
        run: npm run db:migrate

      - name: Set up Python (Stage 2 pipeline)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Stage 2 pipeline deps
        working-directory: pipeline
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --quiet --upgrade pip
          ./.venv/bin/pip install --quiet -r requirements.txt

      - name: Start API
        run: |
          npx tsx src/server.ts > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/dev/users >/dev/null; then echo "API up"; exit 0; fi
            sleep 2
          done
          echo "API did not start"; cat /tmp/server.log; exit 1

      - name: Run all suites
        run: npm run verify:all

      - name: API log (on failure)
        if: failure()
        run: cat /tmp/server.log || true

  web-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Token check
        run: npm run check:tokens

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: devpass
          MYSQL_DATABASE: mission_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pdevpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies (API and web)
        run: |
          npm ci
          npm --prefix web ci

      - name: Load MySQL timezone tables
        run: |
          CID=$(docker ps -q --filter ancestor=mysql:8 | head -1)
          docker exec "$CID" sh -c "mysql_tzinfo_to_sql /usr/share/zoneinfo | mysql -uroot -pdevpass mysql"

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed

      # Installed on EVERY run. After the move to a new machine the pinned
      # browser was missing and the whole suite was silently unrunnable.
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Start API and web
        run: |
          npx tsx src/server.ts > /tmp/server.log 2>&1 &
          (cd web && npx next start -p 3001 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/api/dev/users >/dev/null && curl -sf http://localhost:3001/login >/dev/null; then echo "stack up"; exit 0; fi
            sleep 2
          done
          echo "stack did not start"; cat /tmp/server.log /tmp/web.log; exit 1

      - name: Playwright (full suite, accessibility included)
        working-directory: web
        run: npx playwright test

      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

      - name: Logs (on failure)
        if: failure()
        run: cat /tmp/server.log /tmp/web.log || true

  audit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: devpass
          MYSQL_DATABASE: mission_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pdevpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies (API and web)
        run: |
          npm ci
          npm --prefix web ci

      - name: Discover MySQL container and load timezone tables
        run: |
          CID=$(docker ps -q --filter ancestor=mysql:8 | head -1)
          echo "MYSQL_CID=$CID" >> "$GITHUB_ENV"  # for docker stop/start only; the tooling itself uses the host mysql clients
          docker exec "$CID" sh -c "mysql_tzinfo_to_sql /usr/share/zoneinfo | mysql -uroot -pdevpass mysql"

      - name: Set up Python (pipeline cases)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Stage 2 pipeline deps
        working-directory: pipeline
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --quiet --upgrade pip
          ./.venv/bin/pip install --quiet -r requirements.txt

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Start API and web
        run: |
          npx tsx src/server.ts > /tmp/server.log 2>&1 &
          (cd web && npx next start -p 3001 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/api/dev/users >/dev/null && curl -sf http://localhost:3001/login >/dev/null; then echo "stack up"; exit 0; fi
            sleep 2
          done
          echo "stack did not start"; cat /tmp/server.log /tmp/web.log; exit 1

      # Cases 43/44 stop and restart MySQL; here that is the service container.
      - name: Audit harness (62 cases)
        env:
          AUDIT_MYSQL_STOP_CMD: docker stop ${{ env.MYSQL_CID }}
          AUDIT_MYSQL_START_CMD: docker start ${{ env.MYSQL_CID }}
          MYSQL_CLIENT: mysql
        run: npm run verify:audit

      - name: Logs (on failure)
        if: failure()
        run: cat /tmp/server.log /tmp/web.log || true
  # ---------------------------------------------------------------- stack --
  # The deployment itself: both images, the whole compose stack, a student
  # journey through Caddy, and the backup round-trip via MinIO. This is the
  # evidence that infra/ works, since it cannot be run on a Windows laptop
  # without Docker.
  stack:
    name: stack (compose, journey, backups)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configuration for the run
        working-directory: infra
        run: |
          # Real-shaped values; secrets are generated here and never committed.
          DB_PASS_VALUE=$(openssl rand -hex 16)
          SESSION_SECRET_VALUE=$(openssl rand -hex 32)
          cat > .env.production <<EOF
          SITE_ADDRESS=:80
          ACME_EMAIL=ci@example.org
          LMS_ORIGIN=https://lms.example.org
          DB_NAME=mission_demo
          DB_PASS=$DB_PASS_VALUE
          SESSION_SECRET=$SESSION_SECRET_VALUE
          SESSION_MAX_AGE=43200
          SESSION_SAMESITE=none
          AUTH_MODE=lti
          CSRF_ENFORCED=true
          SELECTION_MODE=legacy
          INSTANCE_COUNT=1
          LOG_LEVEL=info
          EOF
          echo "wrote infra/.env.production ($(wc -l < .env.production) lines)"

          # This workflow sets DB_PASS=devpass and AUTH_MODE=dev at the top level
          # for the harness jobs, and Docker Compose gives the SHELL environment
          # precedence over --env-file. Without this, the production-shape test
          # would be handed dev auth and a shipped-default password — which the
          # app rightly refuses to boot with. Override them for this job so the
          # generated file is what actually reaches the containers.
          {
            echo "DB_PASS=$DB_PASS_VALUE"
            echo "SESSION_SECRET=$SESSION_SECRET_VALUE"
            echo "AUTH_MODE=lti"
            echo "DB_NAME=mission_demo"
          } >> "$GITHUB_ENV"

      # The compose file cannot rot unnoticed.
      - name: docker compose config
        working-directory: infra
        run: |
          docker compose --env-file .env.production config > /dev/null
          docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.ci.yml config > /dev/null
          echo "compose files valid"

      # Job logs need repository-admin rights to read, so a build failure has to
      # explain itself in an annotation instead.
      - name: Build images
        working-directory: infra
        run: |
          set -o pipefail
          if ! docker compose --env-file .env.production build api web backup 2>&1 | tee /tmp/build.log; then
            echo "::error title=Stack image build failed::$(tail -c 900 /tmp/build.log | paste -sd' ' -)"
            exit 1
          fi

      # ---- 1. Production shape: exactly what ships to the server.
      - name: Bring the stack up (production configuration)
        working-directory: infra
        run: |
          set -o pipefail
          if ! docker compose --env-file .env.production up -d mysql migrate api web caddy 2>&1 | tee /tmp/up.log; then
            echo "::error title=Stack up failed::$(grep -iE 'error|unhealthy|dependency|exited' /tmp/up.log | tail -5 | paste -sd' | ' - | tail -c 800)"
            docker compose --env-file .env.production ps -a > /tmp/ps.log 2>&1 || true
            echo "::error title=Stack state::$(tail -c 700 /tmp/ps.log | paste -sd' ' -)"
            docker compose --env-file .env.production logs --tail=40 > /tmp/svc.log 2>&1 || true
            echo "::error title=Service logs::$(tail -c 1400 /tmp/svc.log | paste -sd' ' -)"
            exit 1
          fi

      - name: Wait for readiness through Caddy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/readyz || true)
            echo "attempt $i: /readyz -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error title=Stack::/readyz never returned 200"
          cd infra && docker compose --env-file .env.production ps && docker compose --env-file .env.production logs --tail=80
          exit 1

      - name: Migrations ran as a one-shot step, before the api
        working-directory: infra
        run: |
          state=$(docker compose --env-file .env.production ps -a --format json migrate | head -1)
          echo "$state"
          echo "$state" | grep -q '"ExitCode":0' || { echo "::error title=Stack::migrate did not exit 0"; exit 1; }
          docker compose --env-file .env.production logs migrate | tail -5

      - name: The production shape refuses what it should
        run: |
          fails=0
          expect() { # expect <what> <expected> <actual>
            if [ "$2" = "$3" ]; then
              echo "  PASS $1 ($3)"
            else
              echo "  FAIL $1 (expected $2, got $3)"
              echo "::error title=Production shape::$1 — expected $2, got $3"
              fails=$((fails + 1))
            fi
          }
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          # Health and readiness are public, and say nothing else.
          expect "/healthz body" '{"status":"ok"}' "$(curl -s http://localhost/healthz)"
          expect "/readyz body" '{"status":"ready"}' "$(curl -s http://localhost/readyz)"
          # The API is reachable THROUGH CADDY (not via the Next rewrite) and
          # refuses an unauthenticated mutation. In this configuration
          # CSRF_ENFORCED=true, so a POST with no token is refused 403 by the
          # double-submit check BEFORE authentication is even reached — earlier
          # than the 401 the same request gets in development. Either is a
          # refusal; what matters is that it is refused and nothing is created.
          submit_code=$(code -X POST http://localhost/api/submit -H 'Content-Type: application/json' -d '{"assignmentId":1,"selected":"a"}')
          case "$submit_code" in
            401 | 403) echo "  PASS unauthenticated POST /api/submit refused ($submit_code)" ;;
            *) echo "::error title=Production shape::unauthenticated POST /api/submit was not refused (got $submit_code)"
               fails=$((fails + 1)) ;;
          esac
          # The staff page is gated server-side: anonymous is redirected to login.
          expect "anonymous GET /quality" 302 "$(code http://localhost/quality)"
          # Dev login must not sign anyone in here. It is not registered at all
          # under AUTH_MODE=lti (404); CSRF refuses it first (403). The thing
          # that must never happen is a session.
          devlogin=$(curl -s -D - -o /dev/null -X POST http://localhost/api/dev/login-as \
            -H 'Content-Type: application/json' -d '{"studentId":1}')
          devcode=$(printf '%s' "$devlogin" | head -1 | awk '{print $2}')
          case "$devcode" in
            403 | 404) echo "  PASS dev login-as refused ($devcode)" ;;
            *) echo "::error title=Production shape::dev login-as was not refused (got $devcode)"; fails=$((fails + 1)) ;;
          esac
          if printf '%s' "$devlogin" | grep -qi 'set-cookie: *mh_session'; then
            echo "::error title=Production shape::dev login-as SET A SESSION in the production configuration"
            fails=$((fails + 1))
          else
            echo "  PASS dev login-as set no session cookie"
          fi
          # The student UI is served by the web container. "Mission Hub" is in
          # the <title>, which is past the first few hundred bytes of head.
          expect "GET /login" 200 "$(code http://localhost/login)"
          if curl -s http://localhost/login | grep -qi 'mission hub'; then
            echo "  PASS /login is the student UI"
          else
            echo "::error title=Production shape::/login did not look like the student UI"
            fails=$((fails + 1))
          fi
          [ "$fails" = "0" ] || exit 1

      # ---- 2. A real student journey, end to end, through Caddy.
      - name: Layer the CI overrides (dev login, seed data, MinIO)
        working-directory: infra
        run: |
          set -o pipefail
          compose() { docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.ci.yml "$@"; }
          if ! compose up -d 2>&1 | tee /tmp/ci-up.log; then
            echo "::error title=CI overrides::up failed — $(tail -c 700 /tmp/ci-up.log | paste -sd' ' -)"
            compose ps -a > /tmp/ci-ps.log 2>&1 || true
            echo "::error title=CI overrides state::$(tail -c 700 /tmp/ci-ps.log | paste -sd' ' -)"
            exit 1
          fi
          if ! compose run --rm -e NODE_ENV=test migrate node dist/seed.js 2>&1 | tee /tmp/seed.log; then
            echo "::error title=CI overrides::seed failed — $(tail -c 700 /tmp/seed.log | paste -sd' ' -)"
            exit 1
          fi
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/readyz)" = "200" ] && break
            sleep 5
          done

      - name: Student journey through Caddy
        run: node .github/scripts/stack-journey.mjs http://localhost

      # ---- 3. Backups: take one, push it offsite, restore FROM the remote copy.
      - name: Backup round-trip via MinIO
        working-directory: .
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_NAME: mission_demo
          BACKUP_S3_ENDPOINT: http://localhost:9000
          BACKUP_S3_REGION: us-east-1
          BACKUP_S3_BUCKET: mission-hub-backups
          BACKUP_S3_ACCESS_KEY: ci-access-key
          BACKUP_S3_SECRET_KEY: ci-secret-key
          BACKUP_S3_REQUIRED: 'true'
          BACKUP_KEEP_DAILY: '2'
          BACKUP_KEEP_WEEKLY: '1'
        run: |
          npm ci
          export DB_PASS=$(grep '^DB_PASS=' infra/.env.production | cut -d= -f2)
          mkdir -p ci-backups

          echo "--- the scheduled sidecar took one on start"
          docker compose --env-file infra/.env.production -f infra/docker-compose.yml -f infra/docker-compose.ci.yml \
            logs backup | tail -20
          aws --endpoint-url http://localhost:9000 s3 ls s3://mission-hub-backups/mission_demo/ | tee /tmp/remote.txt
          test -s /tmp/remote.txt || { echo "::error title=Backups::the sidecar uploaded nothing"; exit 1; }

          echo "--- a manual backup uploads too"
          BACKUP_DIR=./ci-backups bash scripts/backup.sh

          echo "--- restore FROM THE REMOTE COPY and run Stage 1 against it"
          VERIFY_SOURCE=remote BACKUP_DIR=./ci-backups bash scripts/backup-verify.sh

      - name: A failed upload fails the backup
        run: |
          export DB_PASS=$(grep '^DB_PASS=' infra/.env.production | cut -d= -f2)
          set +e
          DB_HOST=127.0.0.1 DB_USER=root DB_NAME=mission_demo \
          BACKUP_S3_ENDPOINT=http://localhost:9999 BACKUP_S3_BUCKET=mission-hub-backups \
          BACKUP_S3_ACCESS_KEY=ci-access-key BACKUP_S3_SECRET_KEY=ci-secret-key \
          BACKUP_S3_REQUIRED=true BACKUP_DIR=./ci-backups bash scripts/backup.sh
          code=$?
          set -e
          test "$code" = "3" || { echo "::error title=Backups::an unreachable bucket should fail the backup (exit 3), got $code"; exit 1; }
          echo "unreachable object storage failed the backup, as it should"

      - name: Logs on failure
        if: failure()
        working-directory: infra
        run: docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.ci.yml logs --tail=120

      - name: Tear down
        if: always()
        working-directory: infra
        run: docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.ci.yml down -v
