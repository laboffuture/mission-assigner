name: CI

on:
  push:
  pull_request:

# Four independent jobs, so each part of the product reports its own result and
# one failure never hides another:
#   api         - root tree: typecheck, lint, format, check:tokens, migrations and
#                 the whole regression suite (verify:all, incl. pytest).
#   web-static  - web tree: typecheck, lint, format, check:tokens, next build.
#   e2e         - the full Playwright suite (journeys across every id length, a11y).
#   audit       - the 62-case audit harness (verify-audit.mjs).
# Every job fails on any failure; nothing here is allowed to be advisory.

env:
  DB_HOST: 127.0.0.1
  DB_USER: root
  DB_PASS: devpass
  DB_NAME: mission_demo
  AUTH_MODE: dev
  LOG_LEVEL: info
  ENABLE_TEST_HOOKS: '1'

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: devpass
          MYSQL_DATABASE: mission_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pdevpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover MySQL container and load timezone tables
        run: |
          CID=$(docker ps -q --filter ancestor=mysql:8 | head -1)
          echo "MYSQL_CID=$CID" >> "$GITHUB_ENV"  # for docker stop/start only; the tooling itself uses the host mysql clients
          # Named-zone support (Asia/Kolkata) for the streak/timezone suite.
          docker exec "$CID" sh -c "mysql_tzinfo_to_sql /usr/share/zoneinfo | mysql -uroot -pdevpass mysql"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Token check (web components)
        run: npm run check:tokens

      - name: Run migrations
        run: npm run db:migrate

      - name: Set up Python (Stage 2 pipeline)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Stage 2 pipeline deps
        working-directory: pipeline
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --quiet --upgrade pip
          ./.venv/bin/pip install --quiet -r requirements.txt

      - name: Start API
        run: |
          npx tsx src/server.ts > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/dev/users >/dev/null; then echo "API up"; exit 0; fi
            sleep 2
          done
          echo "API did not start"; cat /tmp/server.log; exit 1

      - name: Run all suites
        run: npm run verify:all

      - name: API log (on failure)
        if: failure()
        run: cat /tmp/server.log || true

  web-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Token check
        run: npm run check:tokens

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: devpass
          MYSQL_DATABASE: mission_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pdevpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies (API and web)
        run: |
          npm ci
          npm --prefix web ci

      - name: Load MySQL timezone tables
        run: |
          CID=$(docker ps -q --filter ancestor=mysql:8 | head -1)
          docker exec "$CID" sh -c "mysql_tzinfo_to_sql /usr/share/zoneinfo | mysql -uroot -pdevpass mysql"

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed

      # Installed on EVERY run. After the move to a new machine the pinned
      # browser was missing and the whole suite was silently unrunnable.
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Start API and web
        run: |
          npx tsx src/server.ts > /tmp/server.log 2>&1 &
          (cd web && npx next start -p 3001 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/api/dev/users >/dev/null && curl -sf http://localhost:3001/login >/dev/null; then echo "stack up"; exit 0; fi
            sleep 2
          done
          echo "stack did not start"; cat /tmp/server.log /tmp/web.log; exit 1

      - name: Playwright (full suite, accessibility included)
        working-directory: web
        run: npx playwright test

      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

      - name: Logs (on failure)
        if: failure()
        run: cat /tmp/server.log /tmp/web.log || true

  audit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: devpass
          MYSQL_DATABASE: mission_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pdevpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies (API and web)
        run: |
          npm ci
          npm --prefix web ci

      - name: Discover MySQL container and load timezone tables
        run: |
          CID=$(docker ps -q --filter ancestor=mysql:8 | head -1)
          echo "MYSQL_CID=$CID" >> "$GITHUB_ENV"  # for docker stop/start only; the tooling itself uses the host mysql clients
          docker exec "$CID" sh -c "mysql_tzinfo_to_sql /usr/share/zoneinfo | mysql -uroot -pdevpass mysql"

      - name: Set up Python (pipeline cases)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Stage 2 pipeline deps
        working-directory: pipeline
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --quiet --upgrade pip
          ./.venv/bin/pip install --quiet -r requirements.txt

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Start API and web
        run: |
          npx tsx src/server.ts > /tmp/server.log 2>&1 &
          (cd web && npx next start -p 3001 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/api/dev/users >/dev/null && curl -sf http://localhost:3001/login >/dev/null; then echo "stack up"; exit 0; fi
            sleep 2
          done
          echo "stack did not start"; cat /tmp/server.log /tmp/web.log; exit 1

      # Cases 43/44 stop and restart MySQL; here that is the service container.
      - name: Audit harness (62 cases)
        env:
          AUDIT_MYSQL_STOP_CMD: docker stop ${{ env.MYSQL_CID }}
          AUDIT_MYSQL_START_CMD: docker start ${{ env.MYSQL_CID }}
          MYSQL_CLIENT: mysql
        run: npm run verify:audit

      - name: Logs (on failure)
        if: failure()
        run: cat /tmp/server.log /tmp/web.log || true
